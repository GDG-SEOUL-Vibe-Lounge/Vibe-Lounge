<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MERGE CONFLICT, 개발자들의 끝나지 않는 논쟁</title>
<link rel="stylesheet" href="../../shared/style.css" />
<style>
  .conflict { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--muted); }
  .opt { display: block; width: 100%; text-align: left; border: 2px solid var(--line); background: var(--bg-2); color: var(--text); border-radius: 14px; padding: 14px; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; margin-top: 8px; position: relative; overflow: hidden; }
  .opt .fill { position: absolute; inset: 0 auto 0 0; opacity: .22; transition: width .6s ease; }
  .opt.a .fill { background: var(--green); } .opt.b .fill { background: var(--red); }
  .opt span { position: relative; }
  .opt .pct { float: right; }
  .opt.mine { border-color: var(--text); }
  .lbl { font-family: ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 800; }
  body.screen .topbar, body.screen .player { display: none; }
  body.screen .wrap { max-width: 1400px; }
  .scr-q { font-size: clamp(26px, 4vw, 52px); font-weight: 900; text-align: center; margin: 30px 0; }
  .bar { display: flex; height: 90px; border-radius: 18px; overflow: hidden; font-size: 28px; font-weight: 900; }
  .bar div { display: flex; align-items: center; justify-content: center; transition: flex .6s; min-width: 80px; }
</style>
</head>
<body>
<div data-topbar></div>
<main class="wrap">
  <section class="player">
    <span class="tag red">실시간 투표</span>
    <h1>⚔️ MERGE CONFLICT</h1>
    <p class="lead">정답이 없는 개발 논쟁! 내 입장을 <b>MERGE</b>(A) 또는 <b>REJECT</b>(B)로 골라주세요. 투표하면 바로 전체 결과가 보여요.
      <span id="goalTxt"></span></p>
    <div class="progress"><i id="prog" style="width:0"></i></div>
    <p class="muted small" id="progTxt" style="margin:6px 0 0"></p>
    <div id="qs"></div>
    <div class="card" style="margin-top:16px">
      <h3>🔥 오늘의 Merge Conflict</h3>
      <p class="muted small">의견이 가장 팽팽하게 갈린 주제 (투표 5표 이상)</p>
      <div id="today"></div>
    </div>
  </section>
  <section id="screen" style="display:none"></section>
</main>
<footer class="foot player">모니터 화면: <a href="index.html?screen=1">?screen=1</a></footer>
<script src="../../shared/firebase-config.js"></script>
<script src="../../shared/core.js"></script>
<script>if(!window.DFS){document.body.insertAdjacentHTML("afterbegin",'<div style="background:#ea4335;color:#fff;padding:14px;font-weight:700">⚠️ 공용 스크립트(shared/core.js)를 불러오지 못했어요. HTML 파일만 따로 받지 말고 저장소 전체(ZIP)를 받아 폴더 구조 그대로 열어주세요.</div>')}</script>
<script>
const QUESTIONS = [
  { id: "fri5", q: "금요일 오후 5시 배포", a: "가능하다", b: "절대 안 된다" },
  { id: "aireview", q: "AI가 작성한 코드도", a: "한 줄씩 리뷰해야 한다", b: "상황에 따라 다르다" },
  { id: "sidetest", q: "사이드 프로젝트에서 테스트 코드 작성은", a: "필수다", b: "선택이다" },
  { id: "dark", q: "개발할 때 테마는", a: "다크 모드", b: "라이트 모드" },
  { id: "tabs", q: "들여쓰기는", a: "탭", b: "스페이스" },
  { id: "squash", q: "PR 머지할 때", a: "Squash merge", b: "커밋 그대로 merge" },
  { id: "comment", q: "좋은 코드에 주석은", a: "필요 없다", b: "그래도 필요하다" },
  { id: "mono", q: "새 프로젝트 저장소 구조", a: "모노레포", b: "멀티레포" },
  { id: "meeting", q: "데일리 스탠드업은", a: "매일 해야 한다", b: "비동기 텍스트면 충분하다" },
  { id: "ide", q: "코딩할 때 이어폰은", a: "노래 들으며 집중", b: "무음이 최고" },
];
const GOAL = 5; // 이 개수 이상 투표하면 빙고 칸/프리퀀시
const S = DFS.store;
const votes = () => S.get("mc:votes", {}); // { qid: { uid: "a"|"b" } }

function tally(qid) {
  const v = votes()[qid] || {};
  const a = Object.values(v).filter((x) => x === "a").length, b = Object.values(v).filter((x) => x === "b").length;
  return { a, b, n: a + b, pa: a + b ? Math.round(a / (a + b) * 100) : 50 };
}

function render() {
  const u = DFS.user.get();
  const v = votes();
  const done = u ? QUESTIONS.filter((q) => v[q.id] && v[q.id][u.uid]).length : 0;
  document.getElementById("goalTxt").textContent = `${GOAL}개 이상 투표하면 빙고 칸(프리퀀시)을 드려요!`;
  document.getElementById("prog").style.width = Math.min(100, done / GOAL * 100) + "%";
  document.getElementById("progTxt").textContent = `${done} / ${QUESTIONS.length}개 투표 완료`;
  document.getElementById("qs").innerHTML = QUESTIONS.map((q) => {
    const mine = u && v[q.id] && v[q.id][u.uid];
    const t = tally(q.id);
    return `<div class="card" style="margin-top:12px">
      <div class="conflict">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</div>
      <h3 style="margin:4px 0 2px">${DFS.esc(q.q)}</h3>
      <button class="opt a ${mine === "a" ? "mine" : ""}" data-q="${q.id}" data-v="a">${mine ? `<i class="fill" style="width:${t.pa}%"></i>` : ""}<span><span class="lbl" style="color:#81c995">MERGE</span> ${DFS.esc(q.a)}</span>${mine ? `<span class="pct">${t.pa}%</span>` : ""}</button>
      <div class="conflict" style="margin-top:6px">=======</div>
      <button class="opt b ${mine === "b" ? "mine" : ""}" data-q="${q.id}" data-v="b">${mine ? `<i class="fill" style="width:${100 - t.pa}%"></i>` : ""}<span><span class="lbl" style="color:#f28b82">REJECT</span> ${DFS.esc(q.b)}</span>${mine ? `<span class="pct">${100 - t.pa}%</span>` : ""}</button>
      <div class="conflict" style="margin-top:6px">&gt;&gt;&gt;&gt;&gt;&gt;&gt; ${mine ? t.n + "명 참여" : "투표하면 결과 공개"}</div>
    </div>`;
  }).join("");
  document.querySelectorAll(".opt").forEach((b) => b.onclick = async () => {
    const me = await DFS.user.require({ needNick: true });
    S.update("mc:votes", {}, (all) => { (all[b.dataset.q] = all[b.dataset.q] || {})[me.uid] = b.dataset.v; return all; });
    const cnt = QUESTIONS.filter((q) => (votes()[q.id] || {})[me.uid]).length;
    if (cnt >= GOAL) { DFS.freq.award(me.uid, "merge-conflict", "MERGE CONFLICT"); DFS.renderWho(); }
    render();
  });
  const today = hottest();
  document.getElementById("today").innerHTML = today ? `<b>${DFS.esc(today.q.q)}</b><div class="muted small">${DFS.esc(today.q.a)} ${today.t.pa}% vs ${DFS.esc(today.q.b)} ${100 - today.t.pa}%, ${today.t.n}명</div>` : `<p class="muted small">아직 집계 중이에요.</p>`;
}

function hottest() {
  return QUESTIONS.map((q) => ({ q, t: tally(q.id) })).filter((x) => x.t.n >= 5).sort((x, y) => Math.abs(x.t.pa - 50) - Math.abs(y.t.pa - 50) || y.t.n - x.t.n)[0];
}

let si = 0;
function renderScreen() {
  const list = QUESTIONS.map((q) => ({ q, t: tally(q.id) }));
  const h = hottest();
  const cur = si % 3 === 0 && h ? h : list[si % list.length];
  si++;
  document.getElementById("screen").innerHTML = `
    <div class="center muted" style="font-size:22px; margin-top:20px">${cur === h ? "🔥 오늘의 Merge Conflict" : "⚔️ MERGE CONFLICT, 실시간 투표"}</div>
    <div class="scr-q">${DFS.esc(cur.q.q)}</div>
    <div class="bar"><div style="flex:${Math.max(cur.t.pa, 8)}; background:var(--green)">${DFS.esc(cur.q.a)} ${cur.t.pa}%</div><div style="flex:${Math.max(100 - cur.t.pa, 8)}; background:var(--red)">${DFS.esc(cur.q.b)} ${100 - cur.t.pa}%</div></div>
    <div class="center muted" style="font-size:20px; margin-top:16px">${cur.t.n}명 참여, QR로 접속해 투표하세요</div>`;
}

if (DFS.qs("screen") === "1") {
  document.body.classList.add("screen");
  document.getElementById("screen").style.display = "block";
  renderScreen(); setInterval(renderScreen, 6000);
}
S.on("mc:votes", () => { render(); if (DFS.qs("screen") === "1") { si = Math.max(0, si - 1); renderScreen(); } });
render();
</script>
</body>
</html>

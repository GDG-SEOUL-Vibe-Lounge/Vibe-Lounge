<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bug &amp; Patch Exchange, 개발자 고민 교환소</title>
<link rel="stylesheet" href="../../shared/style.css" />
<style>
  .issue { cursor: pointer; }
  .issue .num { color: var(--muted); font-weight: 400; }
  .st { font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; }
  .st.OPEN { background: rgba(52,168,83,.18); color: #81c995; }
  .st.ANSWERED { background: rgba(66,133,244,.18); color: #8ab4f8; }
  .st.RESOLVED { background: rgba(160,120,255,.2); color: #c5a8ff; }
  .patch { border-left: 3px solid var(--line); padding: 8px 12px; margin: 10px 0; background: var(--bg-2); border-radius: 0 10px 10px 0; }
  .patch.accepted { border-color: var(--green); }
  .diffline { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div data-topbar></div>
<main class="wrap">
  <span class="tag green">고민 공유 게시판</span>
  <h1>🛠️ Bug &amp; Patch Exchange</h1>
  <p class="lead">GitHub Issue처럼 고민을 <b>Issue</b>로 올리면, 다른 참가자가 경험을 바탕으로 <b>Patch</b>(해결 방법, 조언)를 남겨요.
    모르는 사람에게 말 걸지 않아도 서로의 경험을 나눌 수 있어요.</p>

  <div id="listView">
    <div class="row between">
      <div class="tabs" id="filters">
        <button data-f="all" class="on">전체</button><button data-f="OPEN">OPEN</button><button data-f="ANSWERED">ANSWERED</button><button data-f="RESOLVED">RESOLVED</button>
      </div>
      <button class="btn sm" id="newBtn">+ New Issue</button>
    </div>
    <div class="card" id="newForm" style="display:none; margin-top:12px">
      <label>제목</label><input type="text" id="nTitle" maxlength="60" placeholder="예: 사이드 프로젝트를 시작해도 항상 중간에 포기하게 돼요." />
      <label>내용 (선택)</label><textarea id="nBody" maxlength="500" placeholder="상황을 조금 더 알려주면 좋은 Patch가 달려요."></textarea>
      <label>라벨</label><select id="nLabel"><option>커리어</option><option>사이드 프로젝트</option><option>코드 리뷰</option><option>협업</option><option>공부법</option><option>번아웃</option><option>기타</option></select>
      <div class="row" style="margin-top:10px"><button class="btn green" id="nSubmit">Submit new issue</button></div>
    </div>
    <div id="list" style="margin-top:12px"></div>
  </div>

  <div id="detailView" style="display:none"></div>
  <p class="muted small" style="margin-top:20px">운영진 숨김 처리: <a href="?admin=1">?admin=1</a>, 부적절한 내용은 숨김 처리될 수 있어요.</p>
</main>
<script src="../../shared/core.js"></script>
<script>
const S = DFS.store;
const admin = DFS.qs("admin") === "1";
let filter = "all";

if (!S.get("bpx:seeded", false)) {
  const now = Date.now();
  S.set("bpx:issues", [
    { id: "i1", n: 1, title: "사이드 프로젝트를 시작해도 항상 중간에 포기하게 돼요.", body: "처음엔 의욕이 넘치는데 기능을 계속 늘리다 보면 지쳐서 멈춰요.", label: "사이드 프로젝트", nick: "예시봇", uid: "SEED", plus: ["A", "B", "C"], hidden: false, resolved: false, at: now - 5.4e6,
      patches: [{ id: "p1", nick: "예시봇2", uid: "SEED2", text: "처음부터 배포 날짜를 정하고, 핵심 기능 3개만 구현하는 건 어떨까요?", up: ["A", "B"], accepted: false, at: now - 3.6e6 }] },
    { id: "i2", n: 2, title: "AI가 짜준 코드를 리뷰할 때 어디까지 봐야 할까요?", body: "", label: "코드 리뷰", nick: "예시봇", uid: "SEED", plus: ["A"], hidden: false, resolved: false, at: now - 1.8e6, patches: [] },
  ]);
  S.set("bpx:seeded", true);
}

const issues = () => S.get("bpx:issues", []);
function status(i) { return i.resolved ? "RESOLVED" : i.patches.length ? "ANSWERED" : "OPEN"; }
function save(fn) { S.update("bpx:issues", [], fn); }
const toggle = (arr, v) => (arr.includes(v) ? arr.filter((x) => x !== v) : arr.concat(v));

document.querySelectorAll("#filters button").forEach((b) => b.onclick = () => {
  document.querySelectorAll("#filters button").forEach((x) => x.classList.toggle("on", x === b)); filter = b.dataset.f; renderList();
});
document.getElementById("newBtn").onclick = () => { const f = document.getElementById("newForm"); f.style.display = f.style.display === "none" ? "block" : "none"; };
document.getElementById("nSubmit").onclick = async () => {
  const title = document.getElementById("nTitle").value.trim();
  if (title.length < 5) return DFS.toast("제목을 5자 이상 적어주세요");
  const u = await DFS.user.require({ needNick: true });
  save((arr) => (arr.push({ id: DFS.id("i_"), n: arr.length + 1, title, body: document.getElementById("nBody").value.trim(), label: document.getElementById("nLabel").value, nick: u.nick, uid: u.uid, plus: [], hidden: false, resolved: false, at: Date.now(), patches: [] }), arr));
  DFS.freq.award(u.uid, "bug-patch", "Bug & Patch Exchange"); DFS.renderWho();
  document.getElementById("nTitle").value = ""; document.getElementById("nBody").value = ""; document.getElementById("newForm").style.display = "none";
  renderList();
};

function renderList() {
  let list = issues(); if (!admin) list = list.filter((i) => !i.hidden);
  if (filter !== "all") list = list.filter((i) => status(i) === filter);
  list.sort((a, b) => b.at - a.at);
  document.getElementById("list").innerHTML = list.map((i) => `
    <div class="card issue" data-id="${i.id}" style="${i.hidden ? "opacity:.4" : ""}">
      <div class="row between"><span class="st ${status(i)}">${status(i)}</span><span class="muted small">💬 ${i.patches.length}, 🙋 ${i.plus.length}</span></div>
      <h3 style="margin-top:8px">${DFS.esc(i.title)} <span class="num">#${i.n}</span></h3>
      <div class="muted small"><span class="tag">${DFS.esc(i.label)}</span> opened ${DFS.timeAgo(i.at)} by ${DFS.esc(i.nick)}</div>
    </div>`).join("") || `<p class="muted">해당하는 Issue가 없어요.</p>`;
  document.querySelectorAll(".issue").forEach((el) => el.onclick = () => openIssue(el.dataset.id));
}

function openIssue(id) {
  const i = issues().find((x) => x.id === id); if (!i) return;
  const u = DFS.user.get();
  const mine = u && u.uid === i.uid;
  document.getElementById("listView").style.display = "none";
  const d = document.getElementById("detailView"); d.style.display = "block";
  d.innerHTML = `
    <button class="btn ghost sm" id="back">← Issues</button>
    <h2>${DFS.esc(i.title)} <span class="muted">#${i.n}</span></h2>
    <div class="row"><span class="st ${status(i)}">${status(i)}</span><span class="muted small">${DFS.esc(i.nick)}, ${DFS.timeAgo(i.at)}, ${DFS.esc(i.label)}</span></div>
    ${i.body ? `<div class="card" style="margin-top:12px; white-space:pre-wrap">${DFS.esc(i.body)}</div>` : ""}
    <div class="row" style="margin-top:10px">
      <button class="btn ghost sm" id="plus">🙋 나도 같은 고민 (${i.plus.length})</button>
      ${mine && !i.resolved ? `<button class="btn sm green" id="resolve">✔ Close as resolved</button>` : ""}
      ${admin ? `<button class="btn sm red" id="hide">${i.hidden ? "다시 공개" : "숨김"}</button>` : ""}
    </div>
    <h3 style="margin-top:20px">Patches (${i.patches.length})</h3>
    ${i.patches.map((p) => `<div class="patch ${p.accepted ? "accepted" : ""}">
        <div class="diffline">+ patch by ${DFS.esc(p.nick)}, ${DFS.timeAgo(p.at)} ${p.accepted ? ", ✅ merged" : ""}</div>
        <div style="white-space:pre-wrap; margin:4px 0">${DFS.esc(p.text)}</div>
        <div class="row"><button class="btn ghost sm" data-up="${p.id}">👍 ${p.up.length}</button>
        ${mine && !p.accepted ? `<button class="btn ghost sm" data-acc="${p.id}">Merge (도움 됐어요)</button>` : ""}</div>
      </div>`).join("") || `<p class="muted small">아직 Patch가 없어요. 첫 Patch를 남겨주세요!</p>`}
    <div class="card"><label style="margin-top:0">Patch 남기기</label><textarea id="pText" maxlength="400" placeholder="비슷한 경험이 있다면 해결 방법이나 조언을 남겨주세요."></textarea>
      <button class="btn" id="pSubmit" style="margin-top:8px">Submit patch</button></div>`;
  const mutate = (fn) => { save((arr) => arr.map((x) => (x.id === id ? fn(x) : x))); openIssue(id); };
  d.querySelector("#back").onclick = () => { d.style.display = "none"; document.getElementById("listView").style.display = "block"; renderList(); };
  d.querySelector("#plus").onclick = async () => { const me = await DFS.user.require({ needNick: true }); mutate((x) => (x.plus = toggle(x.plus, me.uid), x)); };
  const r = d.querySelector("#resolve"); if (r) r.onclick = () => mutate((x) => (x.resolved = true, x));
  const h = d.querySelector("#hide"); if (h) h.onclick = () => mutate((x) => (x.hidden = !x.hidden, x));
  d.querySelectorAll("[data-up]").forEach((b) => b.onclick = async () => { const me = await DFS.user.require({ needNick: true }); mutate((x) => (x.patches.forEach((p) => { if (p.id === b.dataset.up) p.up = toggle(p.up, me.uid); }), x)); });
  d.querySelectorAll("[data-acc]").forEach((b) => b.onclick = () => mutate((x) => (x.patches.forEach((p) => { if (p.id === b.dataset.acc) p.accepted = true; }), x)));
  d.querySelector("#pSubmit").onclick = async () => {
    const t = d.querySelector("#pText").value.trim(); if (t.length < 5) return DFS.toast("Patch를 5자 이상 적어주세요");
    const me = await DFS.user.require({ needNick: true });
    mutate((x) => (x.patches.push({ id: DFS.id("p_"), nick: me.nick, uid: me.uid, text: t, up: [], accepted: false, at: Date.now() }), x));
    DFS.freq.award(me.uid, "bug-patch", "Bug & Patch Exchange"); DFS.renderWho();
  };
}
S.on("bpx:issues", () => { if (document.getElementById("listView").style.display !== "none") renderList(); });
renderList();
</script>
</body>
</html>
